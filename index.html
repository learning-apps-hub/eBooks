<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>eBooks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/css/style.css">
<style>
  .book-card.numbers { --accent: #FF6B6B; }
  .book-card.alphabet { --accent: #4FC3F7; }
  .book-card.numbers .icon-wrap {
    background: linear-gradient(135deg, #FFE5B4, #FFB7C5);
    border-radius: 24px; padding: 20px; font-size: 3rem; line-height: 1;
  }
  .book-card.alphabet .icon-wrap {
    background: linear-gradient(135deg, #B7E5FF, #D7B7FF);
    border-radius: 24px; padding: 20px; font-size: 3rem; line-height: 1;
  }
  .book-card.local .icon-wrap {
    width: 96px; height: 72px; border-radius: 20px;
    display: grid; place-items: center; color: #fff;
    font-weight: 900; font-size: 1.8rem;
  }
  .progress-line { color: #888; font-size: .9rem; font-weight: 800; min-height: 1.2em; }
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>

<main class="home-page">
  <h1 class="home-title">📚 eBooks</h1>
  <p class="home-subtitle">English · 中文 · Polski</p>

  <div class="book-grid" id="bookGrid">
    <a href="books/numbers/" class="book-card numbers">
      <div class="icon-wrap">123</div>
      <div class="title">Numbers</div>
      <div class="subtitle">0 → 100</div>
    </a>

    <a href="books/alphabet/" class="book-card alphabet">
      <div class="icon-wrap">ABC</div>
      <div class="title">Alphabet</div>
      <div class="subtitle">A → Z</div>
    </a>
  </div>
</main>

<!--
  Local-only books (private-only source material) are never listed here.
  If books/local-books.js exists on this server, it defines
  window.EBOOKS_LOCAL_BOOKS and this page renders cards for it. On the
  public GitHub Pages deploy that file doesn't exist (gitignored, never
  committed) so onerror below just leaves the array empty.
-->
<script src="books/local-books.js" onerror="window.EBOOKS_LOCAL_BOOKS = []"></script>

<script>
  // Generate floating bubbles
  const COLORS = ['#FF6B6B','#4FC3F7','#66BB6A','#FFD54F','#CE93D8','#FF8A65'];
  const wrap = document.getElementById('bubbles');
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 30 + Math.random() * 80;
    Object.assign(b.style, {
      width:  size + 'px',
      height: size + 'px',
      left:   Math.random() * 100 + '%',
      bottom: '-120px',
      background: COLORS[Math.floor(Math.random() * COLORS.length)],
      animationDuration: (8 + Math.random() * 14) + 's',
      animationDelay:    (Math.random() * 10) + 's',
    });
    wrap.appendChild(b);
  }

  // Render any local-only book cards (see comment above the script tag).
  const grid = document.getElementById('bookGrid');
  (window.EBOOKS_LOCAL_BOOKS || []).forEach(book => {
    const a = document.createElement('a');
    a.href = `books/${book.slug}/`;
    a.className = 'book-card local';
    a.style.setProperty('--accent', book.accent || '#4FC3F7');
    a.dataset.progress = book.slug;
    a.dataset.pages = book.pages;
    a.innerHTML = `
      <div class="icon-wrap" style="background:${book.iconBg || 'var(--accent)'};">${book.icon || ''}</div>
      <div class="title">${book.title}</div>
      <div class="subtitle">${book.subtitle || ''}</div>
      <div class="progress-line"></div>
    `;
    grid.appendChild(a);
  });

  document.querySelectorAll('[data-progress]').forEach(card => {
    const slug = card.dataset.progress;
    const total = Number(card.dataset.pages);
    const saved = Number(localStorage.getItem(`ebooks:${slug}:progress`));
    const line = card.querySelector('.progress-line');
    if (!line || !Number.isFinite(saved)) return;
    const page = Math.min(total, Math.max(1, saved + 1));
    line.textContent = `Continue: page ${page} of ${total}`;
  });
</script>
</body>
</html>
